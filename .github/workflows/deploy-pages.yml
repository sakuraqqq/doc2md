# deploy-pages.yml — doc2md GitHub Pages 部署（纯静态站，零构建步骤：checkout → configure → upload → deploy）
# 触发口径（2026-09-16 用户拍板 ②，契约组 **H15** 守卫）：**只在 tag 推送时部署**（`v*`）+ 手动 `workflow_dispatch`。
#   为什么不再用 `push: branches: [main]`：push main 即上线会让「**线上 == 发布物**」这条核对口径失效 ——
#   2026-09-16 实测：依赖批推到 main 后，线上产物变成 121,406 B 的 main 构建，而 v0.1.9 发布物是 121,229 B。
#   想提前上手机试未发版改动 → Actions 页 `Run workflow`（手动触发一次即可，不影响口径）。
# 注意：workflow 运行于 checkout 后的干净仓库树，.gitignore 已排除 node_modules/.tmp/.npm-cache 等，
# 不会上传到 Pages。发布动作（push/tag/release）由用户终端执行，本 workflow 只做部署。
name: deploy-pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # t11 §2.2/§2.10 站点白名单部署：只发布站点必要文件（应用壳 + vendor + langs + icons + PWA 资源），
      # 不再整仓上传——tests/data（511KB 真实论文/大样例）与 docs/ 不得公开到 Pages（再分发风险）
      - name: 站点白名单组装
        run: |
          mkdir _site
          cp index.html manifest.json sw.js .nojekyll _site/
          cp -r vendor langs icons _site/
      # 2026-09-12 纳入（v0.1.3）：白名单 cp 的代价是「新增必需顶层文件会静默漏发」——
      # 部署前按「引用即必需」核对 index.html / sw.js 的同源引用与必需顶层文件/目录。
      - name: 站点白名单 smoke（引用即必需）
        run: node tools/deploy-smoke.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
