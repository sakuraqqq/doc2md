# deploy-pages.yml — doc2md GitHub Pages 自动部署（照 cola-factory-optimizer 同款结构）
# 纯静态站（index.html + manifest/sw/icons），零构建步骤：checkout → configure → upload → deploy。
# 注意：workflow 运行于 checkout 后的干净仓库树，.gitignore 已排除 node_modules/.tmp/.npm-cache 等，
# 不会上传到 Pages。发布动作（push/tag/release）由用户终端执行，本 workflow 只做部署。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
