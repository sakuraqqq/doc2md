# deploy-pages.yml — doc2md GitHub Pages 自动部署（照 cola-factory-optimizer 同款结构）
# 纯静态站（index.html + manifest/sw/icons），零构建步骤：checkout → configure → upload → deploy。
# 注意：workflow 运行于 checkout 后的干净仓库树，.gitignore 已排除 node_modules/.tmp/.npm-cache 等，
# 不会上传到 Pages。发布动作（push/tag/release）由用户终端执行，本 workflow 只做部署。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # t11 §2.2/§2.10 站点白名单部署：只发布站点必要文件（应用壳 + vendor + langs + icons + PWA 资源），
      # 不再整仓上传——tests/data（511KB 真实论文/大样例）与 docs/ 不得公开到 Pages（再分发风险）
      - name: 站点白名单组装
        run: |
          mkdir _site
          cp index.html manifest.json sw.js .nojekyll _site/
          cp -r vendor langs icons _site/
      # 2026-09-12 纳入（v0.1.3）：白名单 cp 的代价是「新增必需顶层文件会静默漏发」——
      # 部署前按「引用即必需」核对 index.html / sw.js 的同源引用与必需顶层文件/目录。
      - name: 站点白名单 smoke（引用即必需）
        run: node tools/deploy-smoke.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
