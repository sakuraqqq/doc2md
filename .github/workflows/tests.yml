# tests.yml — doc2md CI 质量门（防屎山 ③ 守门）
# 模板：cola（可乐工厂效率计算器）tests.yml；按任务书扩展为 checks job：
#   build-consistency → lint → 守卫自测 → baseline 守卫 → 交付面依赖审计 → metrics（超限必须为 0）
#   → 站点白名单 smoke（组装临时 _site）→ npm test（显式 TAP reporter）→ **TAP ↔ BASELINE.json 对账**
#   → pwa-audit → verify:ocr
# 说明：
#   - 触发：push main · **push tag `v*`**（2026-09-17 加固：发布 tag 也必须过同款门禁，见第九轮审查 §4.4）
#     · PR。⚠️ 残留：GitHub 无「workflow 间依赖」，deploy-pages 不会等本 workflow 跑完才开始部署 ——
#     故发布纪律仍要求 tag 指向**已在 main 过 CI 的提交**（RELEASE-CHECKLIST §2）。
#   - npm test（node --test）需要 chromium：install 步骤提供（--with-deps 含系统依赖）
#   - OCR 相关步骤（verify:ocr / image 契约用例）需要 vendor/tessdata 与 langs/（仓库全量检出）
#   - Lint 对象 = src/**/*.js + tools/**/*.mjs（见 eslint.config.js 白名单策略）
#   - metrics 门禁（2026-09-10 用户拍板）：`npm run metrics` 在「超限函数数 > 0」时 exit 1
#     ——减脂批后全仓超限已清零，故按「必须为 0」硬门禁接入 CI。
#   - 交付面依赖审计（2026-09-16 用户拍板 B 项）：`node tools/audit-delivery.mjs` 只拦
#     「进入交付产物的依赖」的未豁免 high/critical（dev/optional 链不阻断）；豁免须写进
#     tools/audit-delivery.mjs 的 ALLOWLIST 并给理由与日期。
#   - 守卫自测（2026-09-17）：`node tools/guard-selftest.mjs` —— deploy-smoke 与 audit-delivery 的
#     正例 + **负例必红**（守卫自己也要能被测红；来源：第九轮审查 §2.2/§2.3）。
#   - baseline 守卫（2026-09-19，卡 001-C）：`node tools/baseline-check.mjs` —— `docs/BASELINE.json`
#     的数字型易变量（契约数 / 发布物与线上产物 / 交付面清单）按仓库实际**现算比对**，漂移即红；
#     负例 3 条（产物哈希 / 契约数 / tag_sha）并入上面的守卫自测。**需要 tag 及其对象** ⇒ checkout
#     用 `fetch-depth: 0`（action 契约：0 = 全历史 + 全部 tag；默认 1 不含 tag）。
#   - 站点白名单 smoke（2026-09-17 前移到 CI）：本地按 deploy-pages 的同款 cp 白名单组装临时 `_site`
#     再跑 deploy-smoke —— 原先只在部署 workflow 里跑，PR/主干不会提前发现「新增顶层文件漏发」。
#   - **契约数对账（2026-09-19 卡 003）**：`npm test` **显式** `--test-reporter=tap`（**不依赖默认 reporter**：
#     Node 20 默认 tap、Node 24 默认 spec —— 2026-09-19 实测），输出落 `tap.txt`；紧随其后跑
#     `baseline-check --from-tap tap.txt --scope ci_clean_checkout`：**实跑 TAP 与 docs/BASELINE.json
#     的 contract 不一致即红**（本步必须排在 npm test **之后** —— 前面拿不到测试结果）。
#     ⚠️ `set -o pipefail` 不能省：否则 `npm test | tee` 会把失败吞成 tee 的退出码。
name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # baseline 守卫要按 tag 现算发布物 blob（tag 及其对象必须到本地）：默认 fetch-depth: 1 不含 tag
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build consistency (src → index.html must be committed)
        run: npm run build && git diff --exit-code index.html
      - name: "Lint (ESLint: src/ + tools/)"
        run: npm run lint
      - name: "Guard selftest (deploy-smoke / audit-delivery / baseline 正例 + 负例必红；2026-09-17)"
        run: node tools/guard-selftest.mjs
      - name: "Baseline guard (docs/BASELINE.json 数字真相源：契约数溯源 + 发布物/线上/交付面现算比对；2026-09-19 卡 001-C)"
        run: node tools/baseline-check.mjs
      - name: "Delivery-face dependency audit (交付面 high/critical 未豁免即红；2026-09-16 用户拍板 B 项)"
        run: node tools/audit-delivery.mjs
      - name: "Code metrics gate (超限函数必须为 0；2026-09-10 用户拍板)"
        run: npm run metrics
      - name: "Site whitelist assembly + deploy smoke (与 deploy-pages 同款 cp 白名单)"
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js .nojekyll _site/
          cp -r vendor langs icons _site/
          node tools/deploy-smoke.mjs _site
      - name: Contract tests (node --test · **显式 TAP reporter**；输出同时落 tap.txt 供对账)
        shell: bash
        run: |
          set -o pipefail
          npm test -- --test-reporter=tap 2>&1 | tee tap.txt
      - name: "Contract ↔ BASELINE.json reconciliation (TAP 摘要 ↔ contract.ci_clean_checkout；2026-09-19 卡 003)"
        run: node tools/baseline-check.mjs --from-tap tap.txt --scope ci_clean_checkout
      - name: PWA audit (static)
        run: node tests/pwa-audit.mjs
      - name: OCR verification (offline tesseract)
        run: npm run verify:ocr
