# doc2md / card 008 (2026-09-20) -- two deviations from the Capacitor template, both
# caused by one real failure: the template shipped networkTimeout=10000 (a 10 s *socket read*
# timeout) together with the "-all" distribution (200+ MB), so the wrapper download from
# services.gradle.org died with: "Downloading ... failed: timeout (10000ms) / Read timed out".
#   1) networkTimeout 10000 -> 120000 (per-read budget; a slow link no longer kills the fetch)
#   2) -all -> -bin (130 MB instead of 230 MB; -bin is sufficient for command-line builds --
#      only IDE source/javadoc browsing wants -all)
# Comments are intentionally ASCII: java.util.Properties.load() reads ISO-8859-1, so non-ASCII
# comments here would show up as mojibake in diagnostics.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
