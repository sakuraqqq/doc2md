apply plugin: 'com.android.application'

// 卡 013 / R-2：版本号的**单一真相源 = 仓库根 package.json 的 version**（**不许手抄** ——
// 手抄就是一处会漂移的副本，本项目已实测过这个病）。
// ⚠️ 读失败一律**抛错**，**绝不回落到模板默认的 `"1.0"`**（口径：「可跳过 = 会静默」）。
//    守卫 = `tools/apk-version-check.mjs`（G3：从**产物侧**读回 versionName/versionCode 与 package.json 对表）。
// 卡 048 / R1：**读法只有一份**（`doc2mdPkgVersion`），`versionName` 与 `versionCode` 都从它派生
//    ⇒ ⛔ 不再有"第二个要人工维护的数"。
def doc2mdPkgVersion = {
    def pkgFile = rootProject.file('../package.json')
    if (!pkgFile.exists()) {
        throw new GradleException("卡 013：找不到 package.json（${pkgFile}）—— 它是版本号唯一真相源，不许回落默认值")
    }
    def parsed
    try {
        parsed = new groovy.json.JsonSlurper().parse(pkgFile)
    } catch (Exception e) {
        throw new GradleException("卡 013：package.json 解析失败（${e.message}）—— 不许回落默认值")
    }
    def v = parsed?.version
    if (!(v instanceof String) || !v.trim()) {
        throw new GradleException("卡 013：package.json 缺 version 字段 —— 不许回落默认值")
    }
    return v.trim()
}

def doc2mdVersionName = doc2mdPkgVersion()

// 卡 048 / R1（需求件：`软著/20261007-需求-versionCode口径（软著线定·主线实现）.md`）：
// `versionCode = major*10000 + minor*100 + patch`（**每段 ≤ 99**，否则会与相邻版本串号）。
// 例：0.1.10 ⇒ 110 · 0.2.0 ⇒ 200 · 1.0.0 ⇒ 10000（⛔ 不要求连续，只要求**严格递增**）。
// ⚠️ 结构与 versionName 同源 ⇒ 「**忘了 bump version**」这种失效模式**结构上不可能发生**
//    （手动 +1 的失败模式正是"忘了"，而人一定会忘）。守卫见 `tools/apk-version-check.mjs` 的 R2-a/R2-b。
def doc2mdVersionCode = {
    def v = doc2mdPkgVersion()
    def m = (v =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (!m.matches()) {
        throw new GradleException("卡 048：version 必须是 x.y.z 形式（当前 \"${v}\"）—— 推导不出 versionCode")
    }
    def segs = [m[0][1], m[0][2], m[0][3]]*.toInteger()
    segs.eachWithIndex { s, i ->
        if (s > 99) {
            throw new GradleException("卡 048：version 第 ${i + 1} 段 = ${s} > 99 —— 公式（major*10000+minor*100+patch）会串号，先拍板换公式")
        }
    }
    return segs[0] * 10000 + segs[1] * 100 + segs[2]
}()

// 卡 049 / A1：**release 签名（两模式）** —— 有 `keystore.properties` 则签名；**没有也照样能构建**。
// ⚠️ 为什么"没有"也必须是合法状态：**F-Droid 用它自己的密钥从源码构建** ⇒ 构建链**不得硬依赖**我方密钥 ✓
// ⚠️ 凭据红线：本文件（含任何口令）**永不入库**（`.gitignore` 拦 `*.jks` / `*.keystore` / `keystore.properties`）；
//    口令只从属性文件读进内存，⛔ 不 print、⛔ 不写进任何产物。
def doc2mdKeystoreProps = new Properties()
def doc2mdKeystorePropsFile = rootProject.file('keystore.properties')   // = android/keystore.properties
def doc2mdHasKeystore = doc2mdKeystorePropsFile.exists()
if (doc2mdHasKeystore) {
    doc2mdKeystorePropsFile.withInputStream { doc2mdKeystoreProps.load(it) }
}

android {
    namespace = "io.github.sakuraqqq.doc2md"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.sakuraqqq.doc2md"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ⭐ 卡 048 / R1：versionCode **由同一个 package.json 的 version 推导**（见上方 `doc2mdVersionCode`）
        //    —— 本条原为「人工 +1」的硬编码 `2`；它的失效模式（**忘了递增** ⇒ 设备与商店都不认为有新版本，
        //    更新静默失效）已由"推导"从结构上消除。公式 = major*10000 + minor*100 + patch（每段 ≤ 99）。
        //    ⚠️ 值从 2 跳到 110（对应 0.1.10）是**允许的**：Android 只要求严格递增，⛔ 不要求连续。
        versionCode doc2mdVersionCode
        // ⭐ versionName 的唯一真相源 = package.json 的 version（见上方 doc2mdVersionName；**不许手抄**）
        versionName doc2mdVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 卡 049 / A1(a)：**有** keystore.properties ⇒ 装配 release 签名配置
    // ⚠️ 口令只在内存里流转（从属性文件读入），⛔ 不 print、⛔ 不写进任何产物/日志
    signingConfigs {
        if (doc2mdHasKeystore) {
            release {
                storeFile rootProject.file(doc2mdKeystoreProps['storeFile'])
                storePassword doc2mdKeystoreProps['storePassword']
                keyAlias doc2mdKeystoreProps['keyAlias']
                keyPassword doc2mdKeystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (doc2mdHasKeystore) {
                signingConfig signingConfigs.release
            } else {
                // 卡 049 / A1(b)：**没有密钥也必须能构建**（F-Droid 用它自己的密钥从源码构建）——
                // ⚠️ 这里是"**明确告知**"，⛔ 不是崩溃、⛔ 也不是静默（可跳过 = 会静默）
                logger.lifecycle('[doc2md] 卡 049：未发现 keystore.properties ⇒ release 产物【未签名】' +
                        '（本地发布请放置该文件；F-Droid 用它自己的密钥构建，无需我方密钥）')
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
